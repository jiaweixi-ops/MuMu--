[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simcity-ai-mayor"
version = "0.1.1"
description = "MuMu + ADB automation foundation for a SimCity BuildIt assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]
vision = [
  "opencv-python>=4.10",
  "rapidocr-onnxruntime>=1.3.24",
]
ui = [
  "PySide6>=6.8",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
